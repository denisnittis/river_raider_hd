<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1016">
<title>River Raid Remaster HD</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d1016;
    --fg: #d9dee8;
    --muted: #8790a0;
    --accent: #f2c94c;
    --accent-glow: rgba(242, 201, 76, 0.45);
    --fire: #ff4757;
    --fire-dark: #b31e2b;
    --fire-glow: rgba(255, 71, 87, 0.6);
    --btn-bg: #1d2430;
    --btn-border: #333c4c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Header (visível no desktop e celular vertical) */
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px;
    width: 100%;
    max-width: 1280px;
    flex-shrink: 0;
    z-index: 10;
  }
  
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  h1 {
    font-size: 15px;
    margin: 0;
    letter-spacing: .06em;
    font-weight: 800;
    white-space: nowrap;
  }
  h1 span { color: var(--accent); }

  #status {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 480px;
  }

  .header-actions {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  button {
    background: var(--btn-bg);
    color: var(--fg);
    border: 1px solid var(--btn-border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    user-select: none;
    -webkit-user-select: none;
  }
  button:active { transform: scale(0.96); }

  /* GAME STAGE (O palco do jogo que agrupa Canvas + Controles em Fullscreen) */
  #game-stage {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
  }

  #wrap {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 8px;
    flex-shrink: 1;
  }

  canvas {
    width: min(100%, 1400px, calc((100vh - 280px) * 1280 / 796));
    aspect-ratio: 1280 / 796;
    display: block;
    background: #000;
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    touch-action: none;
  }

  /* ========================================================
     CONTROLES VIRTUAIS (TOUCH PAD)
     ======================================================== */
  #touch-controls {
    width: 100%;
    max-width: 960px;
    padding: 8px 16px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    z-index: 20;
    flex-shrink: 0;
  }

  /* D-PAD */
  .dpad-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    touch-action: none;
  }

  .dpad-base {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #202735 0%, #11151e 100%);
    border: 3px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), inset 0 2px 6px rgba(255, 255, 255, 0.08);
    position: relative;
    touch-action: none;
    cursor: pointer;
  }

  .dpad-cross {
    position: absolute;
    inset: 18px;
    border-radius: 10px;
    pointer-events: none;
  }
  .dpad-cross::before, .dpad-cross::after {
    content: '';
    position: absolute;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 6px;
  }
  .dpad-cross::before { top: 0; bottom: 0; left: 34%; right: 34%; }
  .dpad-cross::after { left: 0; right: 0; top: 34%; bottom: 34%; }

  .dpad-arrow {
    position: absolute;
    color: var(--muted);
    font-size: 18px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: color 0.1s, transform 0.1s;
    line-height: 1;
  }
  .dpad-arrow span.hint {
    font-size: 8px;
    letter-spacing: 0.05em;
    opacity: 0.7;
    margin-top: 2px;
  }
  .dpad-arrow.active {
    color: var(--accent);
    filter: drop-shadow(0 0 8px var(--accent-glow));
    transform: scale(1.2);
  }

  #dpad-up { top: 8px; left: 50%; transform: translateX(-50%); }
  #dpad-up.active { transform: translateX(-50%) scale(1.2); }
  
  #dpad-down { bottom: 8px; left: 50%; transform: translateX(-50%); }
  #dpad-down.active { transform: translateX(-50%) scale(1.2); }
  
  #dpad-left { left: 8px; top: 50%; transform: translateY(-50%); }
  #dpad-left.active { transform: translateY(-50%) scale(1.2); }
  
  #dpad-right { right: 8px; top: 50%; transform: translateY(-50%); }
  #dpad-right.active { transform: translateY(-50%) scale(1.2); }

  .dpad-stick {
    position: absolute;
    width: 52px;
    height: 52px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #3c485c 0%, #181e28 100%);
    border: 2px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.15);
    pointer-events: none;
    transition: transform 0.05s ease-out;
  }

  /* PAINEL CENTRAL (START / SELECT / UTILITÁRIOS) */
  .console-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex: 1;
    max-width: 300px;
  }

  .main-console-btns {
    display: flex;
    gap: 10px;
    width: 100%;
    justify-content: center;
  }

  .btn-arcade-start {
    background: linear-gradient(180deg, #f7d358 0%, #d49511 100%);
    color: #111;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: .08em;
    padding: 10px 18px;
    border-radius: 20px;
    border: 2px solid #ffe685;
    box-shadow: 0 4px 12px rgba(242, 201, 76, 0.35);
    cursor: pointer;
  }
  .btn-arcade-start:active, .btn-arcade-start.active {
    transform: scale(0.93) translateY(2px);
    background: linear-gradient(180deg, #d49511 0%, #b87e08 100%);
  }

  .btn-arcade-select {
    background: linear-gradient(180deg, #2b3545 0%, #171c26 100%);
    color: var(--fg);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    padding: 10px 14px;
    border-radius: 20px;
    border: 2px solid #3c485c;
    cursor: pointer;
  }
  .btn-arcade-select:active, .btn-arcade-select.active {
    transform: scale(0.93) translateY(2px);
    border-color: var(--accent);
  }

  .quick-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .quick-btn {
    background: rgba(29, 36, 48, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11px;
    color: var(--fg);
    cursor: pointer;
  }
  .quick-btn.active {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
    font-weight: bold;
  }
  .quick-btn.muted {
    opacity: 0.6;
    border-color: #e74c3c;
  }

  /* BOTÃO FIRE (TIRO) */
  .fire-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }

  .btn-fire {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff5252 0%, #b71523 100%);
    border: 3px solid #ff7b7b;
    color: #fff;
    font-weight: 900;
    font-size: 16px;
    letter-spacing: .08em;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px var(--fire-glow), inset 0 3px 6px rgba(255, 255, 255, 0.4);
    cursor: pointer;
    touch-action: none;
  }
  .btn-fire span.fire-icon {
    font-size: 20px;
    line-height: 1;
    margin-bottom: 2px;
  }
  .btn-fire.active, .btn-fire:active {
    transform: scale(0.91) translateY(2px);
    background: radial-gradient(circle at 35% 35%, #e01122 0%, #850c16 100%);
    box-shadow: 0 2px 10px var(--fire-glow);
    filter: brightness(1.2);
  }

  /* ========================================================
     MODO HORIZONTAL (LANDSCAPE) E TELA CHEIA (FULLSCREEN)
     Experiência estilo console portátil (Switch / Game Boy)
     ======================================================== */
  @media (orientation: landscape), (min-aspect-ratio: 1.2 and max-height: 600px) {
    header {
      display: none !important;
    }

    #game-stage {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      background: #000;
      justify-content: center;
      align-items: center;
      padding: 0;
      margin: 0;
    }

    #wrap {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      height: 100vh;
      height: 100dvh;
      width: auto;
      max-width: 100vw;
      aspect-ratio: 1280 / 796;
      border-radius: 0;
      box-shadow: none;
    }

    /* Controles flutuantes sobrepostos nas laterais */
    #touch-controls {
      position: absolute;
      inset: 0;
      max-width: none;
      padding: 0 20px 16px;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 100;
    }

    .dpad-container, .fire-container {
      pointer-events: auto;
    }

    /* D-pad no canto inferior esquerdo */
    .dpad-base {
      width: 130px;
      height: 130px;
      background: radial-gradient(circle at 40% 40%, rgba(32, 39, 53, 0.85) 0%, rgba(17, 21, 30, 0.95) 100%);
      border: 2px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
    }
    .dpad-stick {
      width: 44px;
      height: 44px;
    }

    /* Botão Fire no canto inferior direito */
    .btn-fire {
      width: 82px;
      height: 82px;
      opacity: 0.92;
      box-shadow: 0 4px 20px var(--fire-glow);
    }

    /* Barra superior com botões de console discretos */
    .console-panel {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      flex-direction: row;
      gap: 8px;
      pointer-events: auto;
      max-width: none;
      background: rgba(13, 16, 22, 0.8);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .main-console-btns {
      width: auto;
      gap: 8px;
    }
    .btn-arcade-start {
      padding: 4px 12px;
      font-size: 11px;
    }
    .btn-arcade-select {
      padding: 4px 10px;
      font-size: 10px;
    }
    .quick-bar {
      width: auto;
      gap: 4px;
    }
    .quick-btn {
      padding: 3px 7px;
      font-size: 10px;
    }
  }

  /* Quando ativado Fullscreen pela API do navegador */
  :fullscreen #game-stage, #game-stage:fullscreen,
  :-webkit-full-screen #game-stage, #game-stage:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>RIVER RAID <span>REMASTER</span></h1>
    <div id="status">Carregando…</div>
  </div>
  <div class="header-actions">
    <input type="file" id="romfile" accept=".a26,.bin" hidden>
    <button id="mode" title="Tecla H">Remaster</button>
  </div>
</header>

<!-- STAGE DO JOGO: agrupa a tela e os botões virtuais -->
<div id="game-stage">
  <div id="wrap">
    <canvas id="screen"></canvas>
  </div>

  <!-- CONTROLES VIRTUAIS (TOUCH GAMEPAD) -->
  <div id="touch-controls" role="region" aria-label="Controles Virtuais Touch">
    <!-- D-PAD ESQUERDA -->
    <div class="dpad-container">
      <div id="dpad" class="dpad-base" title="Deslize o polegar para pilotar">
        <div class="dpad-cross"></div>
        <div id="dpad-up" class="dpad-arrow">▲<span class="hint">ACELERA</span></div>
        <div id="dpad-down" class="dpad-arrow">▼<span class="hint">FREIA</span></div>
        <div id="dpad-left" class="dpad-arrow">◀</div>
        <div id="dpad-right" class="dpad-arrow">▶</div>
        <div id="dpad-stick" class="dpad-stick"></div>
      </div>
    </div>

    <!-- PAINEL DE CONSOLE (CENTRO NA VERTICAL / TOPO NA HORIZONTAL) -->
    <div class="console-panel">
      <div class="main-console-btns">
        <button id="btn-start" class="btn-arcade-start" title="Começar ou reiniciar partida">▶ START</button>
        <button id="btn-select" class="btn-arcade-select" title="Opções de jogo Atari">SELECT</button>
      </div>
      <div class="quick-bar">
        <button id="btn-mode-touch" class="quick-btn" title="Alternar visual Remaster / Retro">✨ HD</button>
        <button id="btn-sound-touch" class="quick-btn" title="Ligar ou desligar áudio">🔊 Som</button>
        <button id="btn-pause-touch" class="quick-btn" title="Pausar o jogo">⏸ Pausa</button>
        <button id="btn-fs-touch" class="quick-btn" title="Tela cheia">⛶ Cheia</button>
      </div>
    </div>

    <!-- BOTÃO FIRE DIREITA -->
    <div class="fire-container">
      <button id="btn-fire" class="btn-fire" title="Disparar mísseis">
        <span class="fire-icon">⚡</span>
        <span>FIRE</span>
      </button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
